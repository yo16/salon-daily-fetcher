# Salon.JP Daily Fetcher 設定ファイル
# - 秘密情報(ID/PW)は .env.local に置く。このファイルには置かない。
# - "<...>" のプレースホルダは、ログイン後の実画面を確認して実値に置き換えること。
#   （プレースホルダが残っていると config 検証でエラーになる）

# --- 対象URL ---
login_url: "https://salon.jp/authentications/login_individual"
list_url: "https://salon.jp/nishino"            # ログイン後のタイムライン（西野亮廣エンタメ研究所）

# 取得対象を投稿者で絞り込む（タイムラインは複数投稿者が混在するため）。
# 空文字にするとフィルタ無効（全投稿が対象）。
author_filter: "西野亮廣エンタメ研究所"

# --- CSSセレクタ（サイト構造に依存する壊れやすい部分のみ集約）---
# 本文は個別ページに遷移せず、タイムライン内(list_item)から相対セレクタで取得する。
selectors:
  login_email: "input[name='ind_email']"
  login_password: "input[name='ind_password']"
  login_submit: "button[type='submit']"
  logged_in_mark: "#js-timeline-container"                              # ログイン後タイムラインの存在で判定
  list_item: "#js-timeline-container > div > div.timeline-view-all > div"  # 各投稿の繰り返し単位
  item_author: ".user-name"                      # list_item 内の投稿者名（author_filter と照合）
  item_title: ".timeline-header-message"         # list_item 内のタイトル
  item_date: ".posted"                           # list_item 内の日時（相対表記）
  body: ".timeline-body-text"                    # list_item 内の本文（インライン全文）
  item_image: ".timeline-body-image"             # 記事ID抽出用（src の /articles/<id>/）。無くても可
  noise: []                                      # 本文から除去するノイズ要素(任意)。例: [".ad"]

# --- 動作設定 ---
headless: true
timeout_ms: 15000          # 要素待機の既定タイムアウト(ms)
throttle_seconds: 2        # 記事間の待機(秒)。過剰アクセス回避
max_items_per_run: 50      # 1実行で取得する本文の上限(安全装置)
order: "newest_first"      # 当日から過去へ遡る
retry:
  max_attempts: 3
  backoff_seconds: 2
on_login_failure: "abort"      # abort | continue
on_element_missing: "skip"     # skip | abort
save_debug_on_error: true      # 失敗時にスクショ+HTMLダンプを保存
output_csv: false              # 一覧CSVエクスポートの要否
body_as_markdown: false        # true: HTML→Markdown変換 / false(既定): inner_text
lock_stale_minutes: 60         # ロックファイルを stale とみなす経過分
